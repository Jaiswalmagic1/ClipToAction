name: PM Discipline Check

# Server-side half of D14. The local hook can be skipped with --no-verify or
# missing entirely on a fresh clone where core.hooksPath was never set; this
# check cannot be bypassed from a developer machine.

on:
  push:
    branches: [main]

jobs:
  pm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether code files changed
        id: code_check
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '\.(py|html|js|mjs|sql)$' | grep -v 'review_pass' || true)
          if [ -n "$CHANGED" ]; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "Changed code files:"
            echo "$CHANGED"
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "No code files changed — skipping PM check."
          fi

      - name: Verify the PM review tag is in the commit message
        if: steps.code_check.outputs.code_changed == 'true'
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          if echo "$MSG" | grep -q "\[PM-REVIEWED\]"; then
            echo "PM review tag found. Check passed."
          else
            echo ""
            echo "FAILED: code files changed but [PM-REVIEWED] is missing from the commit message."
            echo "Complete review_pass.json before committing code, and make sure the local"
            echo "hooks are enabled: git config core.hooksPath .githooks"
            echo ""
            exit 1
          fi
