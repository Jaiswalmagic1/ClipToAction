<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipToAction</title>
  <meta name="robots" content="noindex">
  <!-- The app used to live here while it was being built beside the old page (D21). It is
       now the root page, and this stays only so that a bookmark, a pinned tab or a link
       somebody already has still lands on the notebook rather than on a 404. The address
       after the # is carried across, so a bookmark of one reel still opens that reel. -->
  <link rel="canonical" href="./">
</head>
<body>
  <p>Opening ClipToAction…</p>
  <script>
    // replace, not assign: the stub must not sit in the back button's history.
    location.replace("./" + location.search + location.hash);
  </script>
  <noscript><p><a href="./">Open ClipToAction</a></p></noscript>
</body>
</html>
