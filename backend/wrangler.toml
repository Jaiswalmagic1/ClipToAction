name = "cliptoaction-api"
main = "src/worker.js"
compatibility_date = "2026-08-12"

# There is deliberately NO database binding or deploy target at the top level. Every real
# deploy names its environment, so `wrangler deploy` with no --env cannot quietly ship to
# production (D20). Use the npm scripts:
#
#   npm run deploy:staging       -> cliptoaction-api-staging  + cliptoaction-staging D1
#   npm run deploy:production    -> cliptoaction-api          + cliptoaction D1
#
# Secrets are per environment and must be set for BOTH:
#   wrangler secret put KEY_ENCRYPTION_SECRET --env staging
#   wrangler secret put WORKER_SERVICE_TOKEN  --env staging
#
#   KEY_ENCRYPTION_SECRET  base64 that decodes to exactly 32 bytes (the Worker asserts it)
#   WORKER_SERVICE_TOKEN   the shared secret the PC worker uses to claim the queue
#
# Use DIFFERENT secret values in staging and production. A staging service token that also
# works in production means a test run can reach real users' data.

# ---------------------------------------------------------------- staging
# Real Cloudflare infrastructure, its own database, no real users. Everything gets proven
# here before production sees it.

[env.staging]
name = "cliptoaction-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "cliptoaction-staging"
database_id = "f4477836-8420-46c1-addb-d2af749af3f2"

# The staging Worker also serves the app itself, from a folder assembled by
# `scripts/build-staging-assets.mjs` (see D26). Assets are matched by filename and every
# API route starts with /v1/, so the two cannot collide -- a request that matches no file
# falls through to the Worker exactly as before.
#
# Staging only, and deliberately so: production serves the app from GitHub Pages (D16).
[env.staging.assets]
directory = ".staging-assets"
not_found_handling = "404-page"
# Serve /app.html literally. Cloudflare otherwise redirects it to /app, and the address
# a phone tests against should be the same one GitHub Pages will serve at the swap (D21).
html_handling = "none"

[env.staging.vars]
FIREBASE_PROJECT_ID = "cliptoaction-ff144"
APP_ORIGIN = "http://localhost:8788"

# ---------------------------------------------------------------- production

[env.production]
name = "cliptoaction-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cliptoaction"
database_id = "set-after-wrangler-d1-create-cliptoaction"

[env.production.vars]
FIREBASE_PROJECT_ID = "cliptoaction-ff144"
APP_ORIGIN = "https://jaiswalmagic1.github.io"
