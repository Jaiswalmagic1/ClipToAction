<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saving to ClipToAction</title>
  <!-- The address of the next page carries the link when storage will not, and the app
       decides whether to trust it by where it came FROM. The browser's own default already
       sends the full URL for a same-origin navigation, so this is belt and braces against
       a stricter policy arriving in a header later — not the thing that makes it work. -->
  <meta name="referrer" content="same-origin">
</head>
<body>
  <p>Opening ClipToAction...</p>
  <script>
    // This page IS the only way a reel gets in (D17), so nothing in it may throw.
    //
    // It used to write to localStorage unguarded, and then navigate. In a private window,
    // or a browser set to block site data, or one whose quota is full, `setItem` THROWS --
    // the script died there, the navigation never happened, and he was left looking at
    // "Opening ClipToAction..." for ever with the reel he had just shared silently gone.
    var params = new URLSearchParams(window.location.search);
    var share = {
      title: params.get("title") || "",
      text: params.get("text") || "",
      url: params.get("url") || ""
    };

    // WHERE THIS PAGE WAS OPENED FROM, and it is the security question, not a detail.
    //
    // This address is public and guessable. Somebody can send him
    // `.../share-target.html?url=<anything>` in a message, and until now tapping it saved
    // that reel with no press: his PC downloads and transcribes it, a day of an AI key
    // goes on it, and content of the sender's choosing lands in the notebook his AI reads.
    //
    // The share sheet itself is a navigation from the operating system, which carries no
    // referring page. A link somebody sent carries the page it was tapped on. So a
    // CROSS-ORIGIN referrer means this was a link, not a share, and the app is told to ask
    // rather than to save.
    //
    // Not airtight, and deliberately not sold as such: a page that sends no referrer at
    // all still looks like a share. The residual is bounded — the save is announced on
    // screen, only allowlisted video hosts are accepted, and there is a daily cap — and
    // closing it completely would cost a press on the one path that has to be effortless.
    var external = true;
    try {
      external = Boolean(document.referrer)
        && new URL(document.referrer).origin !== window.location.origin;
    } catch (error) {
      external = true;
    }

    // A QUEUE, not one slot.
    //
    // One fixed key meant the second share overwrote the first, and the navigation for the
    // second destroyed the first's page before it had finished saving. Three reels shared
    // one after another -- which is exactly how somebody clears a saved-posts list -- left
    // one. And the app used to empty this slot the moment it read it, so an offline save
    // that then failed lost the reel for good: it existed only as text in a box, which
    // dies with the tab when the phone reclaims it.
    //
    // So: append, and let the app remove an entry only once the API has taken it.
    var stored = false;
    if (!external) {
      try {
        var waiting = [];
        try {
          waiting = JSON.parse(localStorage.getItem("cliptoaction-pending-shares") || "[]");
          if (!Array.isArray(waiting)) waiting = [];
        } catch (readError) {
          waiting = [];
        }
        share.at = Date.now();
        waiting.push(share);
        // A ceiling, so a bug that never drains this cannot fill his storage and take the
        // whole app down with it. The OLDEST go first: the newest share is the one he is
        // watching happen.
        if (waiting.length > 25) waiting = waiting.slice(waiting.length - 25);
        localStorage.setItem("cliptoaction-pending-shares", JSON.stringify(waiting));
        stored = true;
      } catch (storageError) {
        // Storage is not available. Fall through -- the address carries it instead.
      }
    }

    // When storage would not take it, or this was a link rather than a share, the link
    // travels in the address of the very next page. Same site, and it is a public video
    // link, so nothing private is being put anywhere it was not already going.
    //
    // The app trusts an address-carried link only when it arrived FROM this page, which is
    // what the referrer policy above is for. Without that marker his own share sheet would
    // degrade, the moment his storage filled up, into "somebody shared this with you,
    // press Save" -- an extra press and a false statement on the one path that has to be
    // effortless.
    // Two different addresses, because they mean two different things and the app must
    // not have to guess. `#/share/` is "this app could not store it, save it for him";
    // `#/share-ask/` is "somebody linked here, put it in the box and let him decide". Both
    // arrive with this page as the referrer, so the route is what separates them.
    var found = (share.url + " " + share.text).match(/https?:\/\/\S+/);
    var carry = "";
    if (!stored && found) {
      carry = (external ? "#/share-ask/" : "#/share/") + encodeURIComponent(found[0]);
    }
    window.location.replace("index.html" + carry);
  </script>
  <noscript><p><a href="index.html">Open ClipToAction</a></p></noscript>
</body>
</html>
